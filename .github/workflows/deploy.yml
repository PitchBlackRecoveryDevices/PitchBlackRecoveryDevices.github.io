name: Deploy to Github Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: pb
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "MD Raza"
          git config user.email "delightreza@gmail.com"

      - name: Fetch and Rebase Upstream
        env:
          UPSTREAM_URL: https://github.com/PitchBlackRecoveryProject/PitchBlackRecoveryProject.github.io.git
          UPSTREAM_BRANCH: pb
          TARGET_BRANCH: pb
        run: |
          git remote add upstream $UPSTREAM_URL
          git fetch upstream
          git rebase upstream/$UPSTREAM_BRANCH
          git push origin $TARGET_BRANCH --force-with-lease

  build:
    needs: sync-upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 'pb'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
