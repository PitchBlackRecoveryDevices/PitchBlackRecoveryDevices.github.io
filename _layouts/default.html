<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title | default: site.title }}</title>
  <link rel="icon" type="image/png" href="/assets/images/Gradient-Red-Logo-1.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Orbitron', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            pbrp: {
              red: '#d32f2f',
              purple: '#9400D3',
              dark: '#000000',
              card: '#121212',
              border: '#27272a'
            }
          },
          backgroundImage: {
            'gradient-primary': 'linear-gradient(135deg, #d32f2f 0%, #9400D3 100%)',
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #000000; color: #e4e4e7; }
    
    .text-gradient {
      background: linear-gradient(135deg, #d32f2f, #9400D3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .glass-nav {
      background: rgba(5, 5, 5, 0.9); /* Slightly darker for better readability */
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Markdown Styling */
    .prose h1, .prose h2, .prose h3 { font-family: 'Orbitron', sans-serif; color: white; margin-top: 1.5em; margin-bottom: 0.5em; font-weight: 700; }
    .prose p, .prose ul, .prose ol { color: #d4d4d8; margin-bottom: 1em; line-height: 1.6; }
    .prose a { color: #d32f2f; transition: 0.2s; }
    .prose a:hover { color: #ef4444; text-decoration: underline; }
    .prose code { background: #18181b; padding: 0.2em 0.4em; border-radius: 0.3em; font-family: 'JetBrains Mono', monospace; color: #fca5a5; font-size: 0.85em; border: 1px solid #27272a; }
    .prose pre { background: #121212; padding: 1em; border-radius: 0.5em; overflow-x: auto; border: 1px solid #27272a; margin-bottom: 1em; }
    .prose pre code { background: transparent; padding: 0; color: #e4e4e7; border: none; }
    .page-heading { @apply text-2xl font-display font-bold text-white border-l-4 border-pbrp-red pl-4 my-6; }
  </style>
</head>
<body class="flex flex-col min-h-screen antialiased selection:bg-pbrp-red/30 selection:text-white">

  <!-- Navbar -->
  <nav class="fixed top-0 w-full z-50 glass-nav transition-all duration-300" id="navbar">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        
        <!-- Logo -->
        <a href="{{ '/' | relative_url }}" class="flex items-center gap-3 group">
          <img class="h-10 w-10 transition-transform group-hover:scale-110" src="/assets/images/Gradient-Red-Logo-1.png" alt="PBRP">
          <span class="font-display font-bold text-lg md:text-xl tracking-wider text-gradient">PitchBlack Recovery Project</span>
        </a>

        <!-- Desktop Menu -->
        <div class="hidden lg:block">
          <div class="ml-10 flex items-baseline space-x-8">
            <a href="{{ '/' | relative_url }}#home" class="text-gray-300 hover:text-white transition-colors">Home</a>
            <a href="{{ '/' | relative_url }}#about" class="text-gray-300 hover:text-white transition-colors">About</a>
            <a href="{{ '/' | relative_url }}#devices" class="text-gray-300 hover:text-white transition-colors">Devices</a>
            <a href="/docs/" class="text-gray-300 hover:text-white transition-colors">Docs</a>
            <a href="{{ '/' | relative_url }}#donate" class="text-pbrp-red hover:text-white font-bold transition-colors">Donate</a>
            <a href="{{ '/' | relative_url }}#faq" class="text-gray-300 hover:text-white transition-colors">FAQ</a>
          </div>
        </div>

        <!-- Mobile Menu Button -->
        <div class="-mr-2 flex lg:hidden">
          <button type="button" id="mobile-menu-btn" class="p-2 rounded-md text-gray-400 hover:text-white hover:bg-white/10 transition-colors">
            <i class="fas fa-bars text-xl"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div class="hidden lg:hidden bg-black/95 backdrop-blur-xl border-b border-white/10 absolute w-full left-0" id="mobile-menu">
      <div class="px-4 pt-2 pb-4 space-y-2">
        <a href="{{ '/' | relative_url }}" class="text-gray-300 hover:text-white block px-3 py-3 rounded-lg hover:bg-white/5 transition-colors">Home</a>
        <a href="{{ '/' | relative_url }}#devices" class="text-gray-300 hover:text-white block px-3 py-3 rounded-lg hover:bg-white/5 transition-colors">Devices</a>
        <a href="/docs/" class="text-gray-300 hover:text-white block px-3 py-3 rounded-lg hover:bg-white/5 transition-colors">Docs</a>
        <a href="{{ '/' | relative_url }}#donate" class="text-pbrp-red font-bold hover:text-white block px-3 py-3 rounded-lg hover:bg-white/5 transition-colors">Donate</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-grow pt-24 pb-12 px-4 sm:px-6 lg:px-8 w-full max-w-7xl mx-auto" onclick="closeMobileMenu()">
    {{ content }}
  </main>

  <!-- Footer -->
  <footer class="border-t border-white/10 bg-zinc-900/50 py-12 mt-auto">
    <div class="max-w-7xl mx-auto px-4 flex flex-col items-center">
      <div class="flex space-x-8 mb-6">
        <a href="https://github.com/PitchBlackRecoveryProject" class="text-gray-500 hover:text-white text-2xl transition-all hover:scale-110">
          <i class="fab fa-github"></i>
        </a>
        <a href="https://t.me/pbrpcom" class="text-gray-500 hover:text-blue-400 text-2xl transition-all hover:scale-110">
          <i class="fab fa-telegram"></i>
        </a>
      </div>
      <p class="text-center text-gray-500 text-sm">
        &copy; 2018 - {{ site.time | date: '%Y' }} <span class="text-gray-300 font-bold">PitchBlack Recovery Project</span>.
        <br>Maintained with <i class="fas fa-heart text-pbrp-red mx-1"></i> by the community.
      </p>
    </div>
  </footer>

  <script>
    // --- Mobile Menu Logic ---
    const btn = document.getElementById('mobile-menu-btn');
    const menu = document.getElementById('mobile-menu');
    const icon = btn.querySelector('i');

    function toggleMenu() {
      const isHidden = menu.classList.contains('hidden');
      if (isHidden) {
        menu.classList.remove('hidden');
        icon.classList.remove('fa-bars');
        icon.classList.add('fa-times');
      } else {
        closeMobileMenu();
      }
    }

    function closeMobileMenu() {
      if (!menu.classList.contains('hidden')) {
        menu.classList.add('hidden');
        icon.classList.remove('fa-times');
        icon.classList.add('fa-bars');
      }
    }

    // Toggle on button click
    btn.addEventListener('click', (e) => {
      e.stopPropagation(); // Prevent triggering close on body click
      toggleMenu();
    });

    // Close when clicking ANY link inside menu
    menu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', closeMobileMenu);
    });

    // Close on Scroll
    let lastScrollY = window.scrollY;
    window.addEventListener('scroll', () => {
      if (Math.abs(window.scrollY - lastScrollY) > 10) { // Small threshold
        closeMobileMenu();
        lastScrollY = window.scrollY;
      }
    });

    // --- Redirect Logic ---
    (function() {
      const hash = window.location.hash;
      if (hash === '#downloads') {
        window.location.replace(window.location.pathname + '#devices');
        return;
      }
    })();
  </script>
</body>
</html>
