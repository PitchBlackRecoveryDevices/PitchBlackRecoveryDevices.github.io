<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title | default: site.title }}</title>
  <link rel="icon" type="image/png" href="/assets/images/Gradient-Red-Logo-1.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            pbrp: {
              red: '#d32f2f',
              purple: '#9400D3',
            },
            md: {
              base: '#000000',
              surface: '#18181b', // zinc-900
              surface2: '#27272a', // zinc-800
              variant: '#3f3f46', // zinc-700
              text: '#E2E2E6',
              subtext: '#A1A1AA'
            }
          },
          backgroundImage: {
            'gradient-primary': 'linear-gradient(135deg, #d32f2f 0%, #9400D3 100%)',
          },
          borderRadius: {
            '4xl': '2rem',
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #000000; color: #E2E2E6; }
    
    .text-gradient {
      background: linear-gradient(135deg, #d32f2f, #9400D3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    /* Floating Navbar Glass */
    .nav-pill {
      background: rgba(30, 30, 30, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    /* Markdown Styling */
    .prose h1, .prose h2, .prose h3 { font-family: 'Outfit', sans-serif; color: white; margin-top: 1.5em; margin-bottom: 0.5em; font-weight: 700; }
    .prose p, .prose ul, .prose ol { color: #A1A1AA; margin-bottom: 1em; line-height: 1.7; }
    .prose a { color: #d32f2f; transition: 0.2s; font-weight: 500; }
    .prose a:hover { color: #ef4444; text-decoration: none; background: rgba(211, 47, 47, 0.1); border-radius: 4px; padding: 0 4px; }
    .prose code { background: #18181b; padding: 0.2em 0.4em; border-radius: 0.5em; font-family: 'JetBrains Mono', monospace; color: #fca5a5; font-size: 0.85em; }
    .prose pre { background: #121212; padding: 1.5em; border-radius: 1.5em; overflow-x: auto; border: 1px solid #27272a; margin-bottom: 1.5em; }
    
    /* Material Ripple */
    .mat-ripple { position: relative; overflow: hidden; transform: translate3d(0, 0, 0); }
    .mat-ripple:after {
      content: "";
      display: block;
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      background-image: radial-gradient(circle, #fff 10%, transparent 10.01%);
      background-repeat: no-repeat;
      background-position: 50%;
      transform: scale(10, 10);
      opacity: 0;
      transition: transform .5s, opacity 1s;
    }
    .mat-ripple:active:after {
      transform: scale(0, 0);
      opacity: .1;
      transition: 0s;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen antialiased selection:bg-pbrp-red/30 selection:text-white">

  <!-- Navbar (Floating Pill Design) -->
  <nav class="fixed top-4 left-0 right-0 z-50 flex justify-center px-4" id="navbar">
    <div class="nav-pill rounded-full px-4 py-3 w-full max-w-5xl relative flex items-center justify-between transition-all duration-300 min-h-[60px]">
        
        <!-- Left: Mobile Menu Button -->
        <div class="flex items-center z-20">
            <button type="button" id="mobile-menu-btn" class="md:hidden p-2 rounded-full text-gray-300 hover:bg-white/10 transition-colors">
                <i class="fas fa-bars text-xl"></i>
            </button>

            <!-- Desktop Logo Left -->
            <a href="{{ '/' | relative_url }}" class="hidden md:flex items-center gap-3 group">
              <img class="h-8 w-8 rounded-full" src="/assets/images/Gradient-Red-Logo-1.png" alt="PBRP">
              <span class="font-bold text-lg tracking-tight">PitchBlack Recovery Project</span>
            </a>
        </div>

        <!-- Absolute Center: Mobile Title & Logo -->
        <div class="absolute inset-0 flex justify-center items-center pointer-events-none md:hidden">
            <a href="{{ '/' | relative_url }}" class="flex items-center gap-2 pointer-events-auto">
              <img class="h-6 w-6 rounded-full" src="/assets/images/Gradient-Red-Logo-1.png" alt="PBRP">
              <!-- Text truncated on small screens to prevent overflow -->
              <span class="font-bold text-sm tracking-tight whitespace-nowrap overflow-hidden text-ellipsis max-w-[200px] sm:max-w-none">
                PitchBlack Recovery Project
              </span>
            </a>
        </div>

        <!-- Center Desktop Links -->
        <div class="hidden md:flex absolute inset-0 justify-center items-center pointer-events-none">
            <div class="pointer-events-auto flex items-center gap-1">
                <a href="{{ '/' | relative_url }}#home" class="px-4 py-2 rounded-full text-sm font-medium text-gray-300 hover:bg-white/10 hover:text-white transition-all">Home</a>
                <a href="{{ '/' | relative_url }}#devices" class="px-4 py-2 rounded-full text-sm font-medium text-gray-300 hover:bg-white/10 hover:text-white transition-all">Devices</a>
                <a href="/docs/" class="px-4 py-2 rounded-full text-sm font-medium text-gray-300 hover:bg-white/10 hover:text-white transition-all">Docs</a>
            </div>
        </div>

        <!-- Right Side: Donate Button or Spacer -->
        <div class="flex items-center z-20">
            <a href="{{ '/' | relative_url }}#donate" class="hidden md:block px-5 py-2 rounded-full bg-md-surface2 text-pbrp-red text-sm font-bold hover:bg-white/10 transition-all">Donate</a>
            
            <!-- Mobile spacer to balance flex -->
            <div class="md:hidden w-8"></div> 
        </div>

    </div>
  </nav>

  <!-- Mobile Menu Overlay -->
  <div class="fixed inset-0 z-40 bg-black/95 backdrop-blur-xl hidden flex flex-col justify-center items-center gap-8 transition-opacity duration-300" id="mobile-menu">
      <a href="{{ '/' | relative_url }}" class="text-2xl font-bold text-white flex items-center gap-2" onclick="closeMobileMenu()">
        <img class="h-8 w-8" src="/assets/images/Gradient-Red-Logo-1.png" alt=""> Home
      </a>
      <a href="{{ '/' | relative_url }}#devices" class="text-2xl font-bold text-white" onclick="closeMobileMenu()">Devices</a>
      <a href="/docs/" class="text-2xl font-bold text-white" onclick="closeMobileMenu()">Docs</a>
      <a href="{{ '/' | relative_url }}#donate" class="text-2xl font-bold text-pbrp-red" onclick="closeMobileMenu()">Donate</a>
      <button onclick="closeMobileMenu()" class="absolute bottom-10 p-4 rounded-full bg-white/10 text-white"><i class="fas fa-times text-xl"></i></button>
  </div>

  <!-- Main Content -->
  <main class="flex-grow pt-32 pb-12 px-4 sm:px-6 lg:px-8 w-full max-w-7xl mx-auto" onclick="closeMobileMenu()">
    {{ content }}
  </main>

  <!-- Footer -->
  <footer class="mt-auto py-12 border-t border-white/5 bg-md-base">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <div class="flex justify-center gap-6 mb-8">
        <a href="https://github.com/PitchBlackRecoveryProject" class="h-12 w-12 rounded-full bg-md-surface flex items-center justify-center text-white hover:bg-md-surface2 transition-all">
          <i class="fab fa-github text-xl"></i>
        </a>
        <a href="https://t.me/pbrpcom" class="h-12 w-12 rounded-full bg-md-surface flex items-center justify-center text-blue-400 hover:bg-md-surface2 transition-all">
          <i class="fab fa-telegram text-xl"></i>
        </a>
      </div>
      <p class="text-md-subtext text-sm">
        &copy; {{ site.time | date: '%Y' }} PitchBlack Recovery Project.
      </p>
    </div>
  </footer>

  <script>
    const btn = document.getElementById('mobile-menu-btn');
    const menu = document.getElementById('mobile-menu');

    function toggleMenu() {
        menu.classList.toggle('hidden');
    }

    function closeMobileMenu() {
        menu.classList.add('hidden');
    }

    btn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleMenu();
    });
  </script>
</body>
</html>
